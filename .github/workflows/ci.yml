name: CI & Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 1. Rust checks — format, clippy, test (all features), WASM build
  # ------------------------------------------------------------------
  rust:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      # NOTE: MSRV verification removed — this is an experimental library that
      # tracks latest stable Rust. Dependencies (e.g. mvt crate) may use newer
      # language features. Pin MSRV if ever needed for downstream consumers.

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests (all features)
        run: cargo test --all-features --verbose -- --test-threads=2
        env:
          RAYON_NUM_THREADS: 1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package (web target, point-cloud + geotiff)
        run: wasm-pack build --target web --release --out-dir pkg --features point-cloud,geotiff,laz-support,mesh-ingest

      - name: Verify WASM output
        run: |
          test -f pkg/wasm_spatial_core_bg.wasm && echo "✅ WASM binary exists"
          test -s pkg/wasm_spatial_core_bg.wasm && echo "✅ WASM binary non-empty ($(stat -c%s pkg/wasm_spatial_core_bg.wasm) bytes)"
          test -f pkg/wasm_spatial_core.js && echo "✅ JS bindings exist"

      - name: Build WASM (Node.js target)
        run: wasm-pack build --target nodejs --release --out-dir pkg-node --features point-cloud,geotiff,laz-support,mesh-ingest

      - name: Run WASM smoke tests (Node.js)
        run: WASM_PKG_DIR=pkg-node node tests/wasm_smoke_test.mjs

      - name: Run Node.js batch API smoke test
        run: node tests/node_batch_test.mjs

      - name: WebGPU CPU fallback smoke (Node)
        run: WASM_PKG_DIR=pkg node tests/webgpu_fallback_test.mjs

      - name: Build WASM (webgpu + terrain-edit smoke pkg)
        run: wasm-pack build --target nodejs --release --out-dir pkg-webgpu-smoke --features point-cloud,geotiff,terrain-edit,webgpu

      - name: Heightfield GPU fallback smoke (Node, skips if unavailable)
        run: |
          PKG=pkg-webgpu-smoke node --input-type=module -e "
          import { pathToFileURL } from 'node:url';
          // nodejs target auto-initializes on import — do NOT call mod.default(),
          // which is a truthy non-function (the already-resolved export namespace)
          // and would throw 'mod.default is not a function'.
          const mod = await import(pathToFileURL('pkg-webgpu-smoke/wasm_spatial_core.js').href);
          if (typeof mod.flattenTerrain !== 'function') { console.log('SKIP: flattenTerrain not exported'); process.exit(0); }
          console.log('flattenTerrain: OK (exported, auto-init complete)');
          "

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: pkg/

  # ------------------------------------------------------------------
  # 1b. Headless browser test — W3.6 CesiumTerrainProvider acceptance
  # ------------------------------------------------------------------
  # Proves our quantized-mesh-1.0 byte stream is loadable by the *real*
  # consumer (Cesium's CesiumTerrainProvider), not just our own decoder.
  # The Rust-side `quantized_mesh_roundtrip_test.rs` only checks the bytes
  # against our own decoder; this job drives a headless Chromium to load
  # layer.json + .terrain tiles via Playwright + Cesium 1.119.
  # See tests/cesium-terrain.spec.mjs, tests/terrain_tms_server.mjs.
  browser-test:
    name: Headless browser tests (W3.6 Cesium + W4 WebGPU bench)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifact (web target)
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: pkg/

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The TMS pyramid generator (tests/terrain_tms_generate.mjs) loads the
      # WASM via Node — it needs the nodejs target build, which the artifact
      # above (web target) cannot provide. Rebuild pkg-node locally; this is
      # cheap (~15s) because the heavy Rust compilation already happened in
      # the `rust` job's cache. Also build pkg-webgpu-bench (web target with
      # the webgpu + terrain-edit features) for the W4 benchmark page.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Rust toolchain (for wasm-pack nodejs build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM (Node.js target for the generator)
        run: wasm-pack build --target nodejs --release --out-dir pkg-node --features point-cloud,geotiff

      - name: Build WASM (web target with webgpu for the bench page)
        run: wasm-pack build --target web --release --out-dir pkg-webgpu-bench --features point-cloud,geotiff,terrain-edit,webgpu

      - name: Install npm dependencies (Playwright)
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Runs both specs via playwright.config.mjs:
      #   - cesium-terrain.spec.mjs (W3.6, always runs)
      #   - webgpu-bench.spec.mjs   (W4, self-skips if no GPU adapter —
      #     ubuntu-latest has no GPU, so this records a SKIP, not a failure)
      - name: Run headless browser tests
        run: npx playwright test --reporter=list

  # ------------------------------------------------------------------
  # 2. Deploy Demo — GitHub Pages on push to master
  # ------------------------------------------------------------------
  demo:
    name: Deploy Demo to GitHub Pages
    needs: rust
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # ── GitHub Pages Setup ──
    # This job deploys to the `gh-pages` branch via peaceiris/actions-gh-pages.
    # Make sure your repo Settings → Pages is configured as:
    #   Source: Deploy from a branch
    #   Branch: gh-pages / (root)
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: pkg/

      - name: Assemble demo site
        run: |
          chmod +x scripts/build-demo-site.sh
          SKIP_WASM_BUILD=1 SITE_OUTPUT=_site bash scripts/build-demo-site.sh
          test -f _site/pkg/wasm_spatial_core_bg.wasm
          test -f _site/pkg/wasm_spatial_core.js
          echo "pkg files:" && ls -la _site/pkg/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true

  # ------------------------------------------------------------------
  # 2b. Deploy API docs — GitHub Pages (docs/api/)
  # ------------------------------------------------------------------
  api-docs:
    name: Deploy API Docs
    runs-on: ubuntu-latest
    needs: rust
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: pkg/
      - run: npx typedoc@latest --entryPoints "npm/pkg/wasm_spatial_core.d.ts"
      - name: Publish docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api
          publish_branch: gh-pages
          destination_dir: docs
          commit_message: "deploy: demo site from CI"

  # ------------------------------------------------------------------
  # 3. Build Release Artifacts — all 3 variants on tag push
  # ------------------------------------------------------------------
  release-build:
    name: Build Release (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            features: ""
            out_dir: pkg
          - name: point-cloud
            features: "--features point-cloud,geotiff"
            out_dir: pkg-point-cloud
          - name: multi-thread
            features: ""
            out_dir: pkg-multi-thread
            nightly: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install nightly toolchain (multi-thread)
        if: matrix.nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.name }}

      - name: Build WASM (default / point-cloud)
        if: "!matrix.nightly"
        run: wasm-pack build --target web --release --out-dir ${{ matrix.out_dir }} ${{ matrix.features }}

      - name: Build WASM (multi-thread with atomics)
        if: matrix.nightly
        run: |
          RUSTFLAGS='-C target-feature=+atomics,+bulk-memory,+mutable-globals' \
          cargo +nightly build -Z build-std=panic_abort,std \
            --target wasm32-unknown-unknown --release --features multi-thread
          cargo install wasm-bindgen-cli --version 0.2.120
          wasm-bindgen --target web --out-dir ${{ matrix.out_dir }} \
            target/wasm32-unknown-unknown/release/wasm_spatial_core.wasm

      - name: Upload Release artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg-${{ matrix.name }}
          path: ${{ matrix.out_dir }}/

  # ------------------------------------------------------------------
  # 4. GitHub Release — upload all artifacts
  # ------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts/
          pattern: wasm-pkg-*
          merge-multiple: false

      - name: Create tarballs
        run: |
          cd release-artifacts
          for dir in wasm-pkg-*; do
            name="${dir#wasm-pkg-}"
            tar czf "../wasm-spatial-core-${name}.tar.gz" -C "$dir" .
          done
          cd ..
          ls -la wasm-spatial-core-*.tar.gz

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## wasm-spatial-core ${{ github.ref_name }}

            ### Downloads
            - **Default build** — `wasm-spatial-core-default.tar.gz` (zero-config, works everywhere)
            - **Point Cloud build** — `wasm-spatial-core-point-cloud.tar.gz` (with LAS/PCD parsing + voxel decimation + GeoTIFF terrain)
            - **Multi-thread build** — `wasm-spatial-core-multi-thread.tar.gz` (requires COOP/COEP headers)

            ### Changes
            ${{ steps.changelog.outputs.changelog }}
          files: |
            wasm-spatial-core-default.tar.gz
            wasm-spatial-core-point-cloud.tar.gz
            wasm-spatial-core-multi-thread.tar.gz

  # ------------------------------------------------------------------
  # 5. npm publish — only on version tags
  # ------------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    needs: rust
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: pkg/

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stage npm package into pkg/
        # The wasm-pkg artifact from download-artifact includes wasm-pack's own
        # pkg/package.json, which has correct `files`/`main`/`types` paths relative
        # to pkg/. We publish from pkg/ using THAT package.json — NOT npm/package.json
        # (whose `pkg/...` paths would double the prefix and omit the .wasm/.js,
        # producing a broken 4-file package as seen in 0.8.0/0.8.1).
        run: |
          cp npm/tsconfig.json pkg/tsconfig.json 2>/dev/null || true
          cp npm/index.ts pkg/index.ts 2>/dev/null || true
          cp npm/node.ts pkg/node.ts 2>/dev/null || true
          cp npm/batch.ts pkg/batch.ts 2>/dev/null || true
          cp npm/draco.ts pkg/draco.ts 2>/dev/null || true
          cp npm/webgpu.ts pkg/webgpu.ts 2>/dev/null || true
          cp npm/abort.ts pkg/abort.ts 2>/dev/null || true
          cp README.md pkg/README.md 2>/dev/null || true

      - name: Install npm dependencies
        working-directory: pkg
        run: npm install --ignore-scripts

      - name: Build TypeScript declarations
        working-directory: pkg
        run: npx tsc --project tsconfig.json --noEmit || true

      - name: Publish to npm
        working-directory: pkg
        # Publish from pkg/ using wasm-pack's own package.json (correct files/main).
        # --ignore-scripts: skip `prepack` (which rebuilds WASM via wasm-pack);
        # this job consumes the pre-built pkg/ from download-artifact, which has
        # no Rust toolchain, so prepack would fail with exit 127.
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ------------------------------------------------------------------
  # 6. Performance Benchmarks — only on master push
  # ------------------------------------------------------------------
  benchmark:
    name: Performance Benchmarks
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmark suite
        run: |
          cargo test --all-features -- benchmark_suite --ignored --nocapture 2>&1 | tee benchmark-results.jsonl

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.jsonl
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────
  # Head-to-head: wasm-spatial-core vs py3dtiles vs loaders.gl
  # Produces the public comparison page at <gh-pages>/benchmarks/index.md
  # ─────────────────────────────────────────────────────────────────────
  head-to-head-bench:
    name: Head-to-head Benchmark (vs py3dtiles)
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install py3dtiles (with LAS support)
        run: pip install "py3dtiles[las]"

      - name: Install loaders.gl (optional; runner degrades gracefully if it fails)
        run: npm install --no-save @loaders.gl/las
        continue-on-error: true

      - name: Build WASM (nodejs target, point-cloud feature)
        run: wasm-pack build --target nodejs --release --out-dir pkg-node -- --features point-cloud

      - name: Run wasm-spatial-core benchmark
        run: |
          WASM_PKG_DIR=pkg-node node bench/head-to-head/run-wasm.mjs \
            bench/head-to-head/fixtures/canonical_500k.las \
            > bench/head-to-head/results-wasm.jsonl

      - name: Run py3dtiles benchmark
        run: |
          python3 bench/head-to-head/run-py3dtiles.py \
            bench/head-to-head/fixtures/canonical_500k.las \
            > bench/head-to-head/results-py3dtiles.jsonl

      - name: Run loaders.gl benchmark (best-effort; documents capability gap)
        run: |
          node bench/head-to-head/run-loaders-gl.mjs \
            bench/head-to-head/fixtures/canonical_500k.las \
            > bench/head-to-head/results-loaders-gl.jsonl 2>/dev/null || true

      - name: Aggregate results
        run: node bench/head-to-head/aggregate.mjs

      - name: Publish comparison to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: benchmarks
          publish_branch: gh-pages
          destination_dir: benchmarks
          keep_files: true
          commit_message: "deploy: head-to-head benchmark from CI"
