<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="wasm-spatial-core logo">
  <defs>
    <linearGradient id="wsc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Octree root frame -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0d1117" stroke="url(#wsc-grad)" stroke-width="1.5" opacity="0.9"/>
  <!-- Point-cloud particles forming a "W" on a 8x8 grid -->
  <g fill="url(#wsc-grad)">
    <!-- Left leg -->
    <circle cx="14" cy="16" r="2.4"/>
    <circle cx="14" cy="26" r="2.6"/>
    <circle cx="14" cy="36" r="2.8"/>
    <circle cx="15" cy="46" r="3"/>
    <!-- Left valley -->
    <circle cx="24" cy="42" r="2.8"/>
    <circle cx="26" cy="34" r="2.6"/>
    <!-- Center peak -->
    <circle cx="32" cy="22" r="3.2"/>
    <circle cx="32" cy="30" r="2.6"/>
    <!-- Right valley -->
    <circle cx="38" cy="34" r="2.6"/>
    <circle cx="40" cy="42" r="2.8"/>
    <!-- Right leg -->
    <circle cx="49" cy="46" r="3"/>
    <circle cx="50" cy="36" r="2.8"/>
    <circle cx="50" cy="26" r="2.6"/>
    <circle cx="50" cy="16" r="2.4"/>
  </g>
  <!-- Sparse scatter accents (depth feel) -->
  <g fill="#00d4ff" opacity="0.35">
    <circle cx="22" cy="14" r="1.2"/>
    <circle cx="42" cy="14" r="1.2"/>
    <circle cx="20" cy="50" r="1.1"/>
    <circle cx="44" cy="50" r="1.1"/>
  </g>
</svg>
