<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="wasm-spatial-core — The fastest spatial engine in the browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2330" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo mark top-left -->
  <g transform="translate(80,70)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#161b22" stroke="url(#grad)" stroke-width="1.5"/>
    <g fill="url(#grad)" transform="translate(8,8) scale(0.75)">
      <circle cx="7" cy="9" r="2.4"/><circle cx="7" cy="14" r="2.6"/><circle cx="8" cy="22" r="3"/>
      <circle cx="12" cy="19" r="2.6"/><circle cx="16" cy="11" r="3.2"/><circle cx="16" cy="15" r="2.6"/>
      <circle cx="20" cy="19" r="2.6"/><circle cx="24" cy="22" r="3"/><circle cx="25" cy="14" r="2.6"/><circle cx="25" cy="9" r="2.4"/>
    </g>
    <text x="80" y="30" font-family="Inter,-apple-system,sans-serif" font-size="20" font-weight="600" fill="#8b949e">wasm-spatial-core</text>
    <text x="80" y="52" font-family="'JetBrains Mono',monospace" font-size="14" fill="#5c6675">v0.9.0 · Rust + WebAssembly</text>
  </g>

  <!-- Headline -->
  <text x="80" y="290" font-family="Inter,-apple-system,sans-serif" font-size="76" font-weight="800" fill="#e6edf3" letter-spacing="-3">The fastest spatial</text>
  <text x="80" y="375" font-family="Inter,-apple-system,sans-serif" font-size="76" font-weight="800" letter-spacing="-3"><tspan fill="url(#grad)">engine</tspan><tspan fill="#e6edf3"> in the browser.</tspan></text>

  <!-- Subhead -->
  <text x="80" y="445" font-family="Inter,-apple-system,sans-serif" font-size="26" font-weight="400" fill="#8b949e">Cesium 3D Tiles · point cloud · terrain · vector · no backend · no upload</text>

  <!-- Perf bars -->
  <g transform="translate(80,490)">
    <text x="0" y="14" font-family="'JetBrains Mono',monospace" font-size="14" fill="#3fb950" font-weight="600">wasm-spatial-core</text>
    <rect x="0" y="22" width="40" height="14" rx="3" fill="#3fb950"/>
    <text x="50" y="34" font-family="'JetBrains Mono',monospace" font-size="14" fill="#3fb950">36 ms</text>

    <text x="0" y="64" font-family="'JetBrains Mono',monospace" font-size="14" fill="#f85149" font-weight="600">py3dtiles</text>
    <rect x="0" y="72" width="3200" height="14" rx="3" fill="#f85149" opacity="0.85" transform="scale(0.1,1)" transform-origin="0 0"/>
    <rect x="0" y="72" width="320" height="14" rx="3" fill="#f85149" opacity="0.85"/>
    <text x="330" y="84" font-family="'JetBrains Mono',monospace" font-size="14" fill="#f85149">2.86 s — 78.7× slower</text>
  </g>

  <!-- Right scatter accent -->
  <g fill="#00d4ff" opacity="0.5" transform="translate(950,180)">
    <circle cx="0" cy="0" r="3"/><circle cx="30" cy="20" r="2"/><circle cx="60" cy="-10" r="2.5"/>
    <circle cx="90" cy="40" r="3.5"/><circle cx="130" cy="10" r="2"/><circle cx="170" cy="60" r="3"/>
    <circle cx="20" cy="80" r="2.5"/><circle cx="70" cy="100" r="2"/><circle cx="120" cy="90" r="3"/>
    <circle cx="180" cy="130" r="2.5"/><circle cx="40" cy="140" r="2"/><circle cx="150" cy="170" r="3"/>
  </g>
  <g fill="#a78bfa" opacity="0.5" transform="translate(1010,120)">
    <circle cx="0" cy="0" r="2.5"/><circle cx="25" cy="30" r="2"/><circle cx="55" cy="15" r="3"/>
    <circle cx="80" cy="55" r="2.5"/><circle cx="110" cy="35" r="2"/><circle cx="140" cy="80" r="3"/>
  </g>
</svg>
